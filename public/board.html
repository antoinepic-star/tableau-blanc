<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tableau blanc</title>
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/board.css">
</head>
<body class="board-page">

  <div id="topbar">
    <div class="topbar-left">
      <h1 id="whiteboardTitle">…</h1>
      <div class="subtitle" id="whiteboardSubtitle"></div>
    </div>
    <div class="topbar-right">
      <div class="avatars" id="onlineAvatars"></div>
      <div class="zoom-controls">
        <button type="button" id="zoomOutBtn" class="icon-btn" title="Dézoomer">−</button>
        <button type="button" id="zoomResetBtn" class="zoom-pct" title="Réinitialiser la vue"><span id="zoomPct">100%</span></button>
        <button type="button" id="zoomInBtn" class="icon-btn" title="Zoomer">+</button>
      </div>
      <div class="add-menu-wrap">
        <button type="button" class="primary-btn" id="addMenuBtn">+ Ajouter</button>
        <div class="add-menu" id="addMenu">
          <button type="button" class="add-menu-item" data-type="note">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4V4z"/><path d="M17 4v3h3"/></svg>
            Post-it
          </button>
          <button type="button" class="add-menu-item" data-type="line">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
            Trait
          </button>
          <button type="button" class="add-menu-item" data-type="text">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>
            Texte
          </button>
          <button type="button" class="add-menu-item" data-type="image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Image
          </button>
        </div>
      </div>
      <input type="file" id="imageFileInput" accept="image/png,image/jpeg" hidden>
    </div>
  </div>

  <div id="canvasViewport">
    <div id="canvasLayer"></div>
  </div>
  <div id="cursorLayer"></div>

  <div class="hint-pill" id="hintPill">Molette = déplacer le tableau · Ctrl/Cmd + molette = zoomer</div>

  <script src="/js/api.js"></script>
  <script src="/js/cursors.js"></script>
  <script src="/js/board.js"></script>
</body>
</html>
