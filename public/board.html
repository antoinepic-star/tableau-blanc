<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tableau blanc</title>
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/board.css">
</head>
<body class="board-page">

  <div id="topbar">
    <div class="topbar-left">
      <h1 id="whiteboardTitle">…</h1>
      <div class="subtitle" id="whiteboardSubtitle"></div>
    </div>
    <div class="topbar-right">
      <div class="avatars" id="onlineAvatars"></div>
      <div class="zoom-controls">
        <button type="button" id="zoomOutBtn" class="icon-btn" title="Dézoomer">−</button>
        <button type="button" id="zoomResetBtn" class="zoom-pct" title="Réinitialiser la vue"><span id="zoomPct">100%</span></button>
        <button type="button" id="zoomInBtn" class="icon-btn" title="Zoomer">+</button>
        <button type="button" id="gridToggleBtn" class="icon-btn" title="Afficher/masquer la grille">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
      </div>
      <input type="file" id="imageFileInput" accept="image/png,image/jpeg" hidden>
    </div>
  </div>

  <div id="canvasViewport">
    <div id="canvasLayer"></div>
  </div>
  <div id="cursorLayer"></div>
  <div class="element-toolbar-floating" id="elementToolbar"></div>
  <div class="rich-text-toolbar element-toolbar-floating" id="richTextToolbar"></div>

  <div class="hint-pill" id="hintPill">Molette = déplacer le tableau · Ctrl/Cmd + molette = zoomer</div>
  <div class="busy-pill" id="busyPill"><span class="busy-spinner"></span>Un instant…</div>

  <!-- Barre "ajouter" flottante (façon Miro) : chaque bouton pose directement son type, sauf les deux
       familles (Formes, Blocs) qui ouvrent le sous-menu #addFlyout avec leurs variantes. -->
  <div class="add-toolbar" id="addToolbar">
    <button type="button" class="add-toolbar-btn" data-type="note" data-tooltip="Post-it">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4V4z"/><path d="M17 4v3h3"/></svg>
    </button>
    <button type="button" class="add-toolbar-btn" data-type="text" data-tooltip="Texte">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>
    </button>
    <button type="button" class="add-toolbar-btn" data-type="image" data-tooltip="Image">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </button>
    <button type="button" class="add-toolbar-btn" data-flyout="shapes" data-tooltip="Formes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2"/><line x1="14" y1="21" x2="21" y2="14"/></svg>
    </button>
    <button type="button" class="add-toolbar-btn" data-type="frame" data-tooltip="Frame">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V6a2 2 0 0 1 2-2h3"/><path d="M15 4h3a2 2 0 0 1 2 2v3"/><path d="M20 15v3a2 2 0 0 1-2 2h-3"/><path d="M9 20H6a2 2 0 0 1-2-2v-3"/></svg>
    </button>
    <button type="button" class="add-toolbar-btn" data-flyout="blocks" data-tooltip="Blocs">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
    </button>
    <span class="add-toolbar-sep"></span>
    <button type="button" class="add-toolbar-btn" id="addToolbarCollapseBtn" data-tooltip="Masquer la barre">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>
  <button type="button" class="add-toolbar-reveal" id="addToolbarRevealBtn" data-tooltip="Ajouter un élément" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div class="add-flyout" id="addFlyout"></div>

  <div class="comment-drawer-overlay" id="commentDrawerOverlay"></div>
  <aside class="comment-drawer" id="commentDrawer">
    <div class="comment-drawer-header">
      <h2>Commentaires</h2>
      <button type="button" class="add-drawer-close" id="commentDrawerCloseBtn" aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="comment-drawer-body" id="commentDrawerBody"></div>
    <div class="comment-drawer-footer">
      <textarea id="commentInput" placeholder="Écrire un commentaire…" maxlength="2000"></textarea>
      <button type="button" class="primary-btn" id="commentSendBtn">Envoyer</button>
    </div>
  </aside>

  <script src="/js/api.js"></script>
  <script src="/js/cursors.js"></script>
  <script src="/js/board.js"></script>
</body>
</html>
